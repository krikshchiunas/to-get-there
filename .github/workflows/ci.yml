# Проверки на каждый push и pull request: тот же набор, что локально.
# Деплой делает Vercel из Git (Settings → Git), а CI говорит, можно ли
# этому коммиту доверять.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Сборка и тесты идут на моках: секреты базы в CI не нужны.
      NEXT_PUBLIC_USE_MOCKS: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      # Порог покрытия чистой логики — в vitest.config.ts (90 % строк).
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # После сборки: tsc смотрит и на типы маршрутов, которые генерирует Next.
      - name: Typecheck
        run: npm run typecheck

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Только зависимости, которые уходят в сборку: известное исключение в
      # линтере описано в docs/SECURITY.md и сюда не попадает.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # Все экраны в браузере на демо-данных: открываются, проходят axe
  # (WCAG 2.2 AA), работают с клавиатуры — на десктопе и на телефоне.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and accessibility
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Со входом и без моков: локальная Supabase, письма в Mailpit, приложение
  # собрано против неё. Регистрация, вход, выход, истёкшая сессия, сброс
  # пароля, права, запись и realtime между двумя людьми (e2e-live).
  e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      # Ключи локального стека — демонстрационные, одинаковые у всех; в
      # окружение job, чтобы их увидели Next и тесты.
      - name: Export local Supabase env
        run: supabase status -o env 2>/dev/null | grep -E '^[A-Z_]+=' | sed -E 's/="(.*)"$/=\1/' >> "$GITHUB_ENV"

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E with sign-in
        run: npm run test:e2e:live

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-live
          path: playwright-report-live
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # База с нуля: все миграции подряд на чистой локальной Supabase, сид и
  # тесты прав (supabase/tests). Ловит и сломанную миграцию, и дыру в RLS.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Только то, без чего не живут схемы auth, storage и realtime: студия,
      # картинки, функции и журналы тестам не нужны.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta,supavisor

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: Schema lint
        run: supabase db lint --level warning --fail-on error

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
